[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "student-journey-intelligence-engine"
version = "0.1.0"
description = "End-to-end ML system predicting student term-over-term persistence, with explainability, API, and dashboard. Built on synthetic, de-identified data for portfolio/educational purposes."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
