name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # libgomp1: OpenMP runtime XGBoost needs at import time on Linux.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # Runs the real pipeline (not fixtures) so the test suite exercises
      # actual generated data / a real trained model, rather than skipping
      # the tests that depend on one.
      - name: Run data + training pipeline
        run: bash scripts/run_pipeline.sh

      - name: Run tests
        run: pytest tests/ -v
