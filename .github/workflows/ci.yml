name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # libgomp1: OpenMP runtime XGBoost needs at import time on Linux.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      # Runs the real pipeline (not fixtures) so the test suite exercises
      # actual generated data / a real trained model, rather than skipping
      # the tests that depend on one.
      - name: Run data + training pipeline
        run: bash scripts/run_pipeline.sh

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test, frontend]
    # Off by default (this repo's established pattern for anything that costs
    # money or needs real credentials — see cloud/storage.py, db.py). Turn on
    # by setting the GCP_DEPLOY_ENABLED repository VARIABLE to "true" and
    # configuring the secrets/variables below — see docs/deployment/gcp.md.
    # Without that, this job is skipped and CI behaves exactly as before.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via scripts/deploy_gcp.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUDSQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
          STUDENT_JOURNEY_API_KEY: ${{ secrets.STUDENT_JOURNEY_API_KEY }}
        run: bash scripts/deploy_gcp.sh
